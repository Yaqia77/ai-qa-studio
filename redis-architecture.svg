  <text x="477" y="680" text-anchor="middle" font-size="11" fill="#8b949e">List · LTRIM 500 · 日志流</text>
  <rect x="600" y="630" width="215" height="66" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <rect x="600" y="638" width="4" height="50" rx="2" fill="#bc8cff" opacity="0.9"/>
